<!DOCTYPE html>
<!-- Landing page for the generated documentation PDFs. -->
<!-- Renders the books.json manifest as category shelves of book covers. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHIS2 Documentation Books</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="masthead">
        <div class="masthead-inner">
            <span class="brand-mark" aria-hidden="true"></span>
            <div class="brand-text">
                <h1>DHIS2 Documentation Library</h1>
                <p id="summary" class="summary"></p>
            </div>
        </div>
    </header>
    <main id="books-container" class="stage">
        <!-- Shelves are loaded here by script.js -->
    </main>
    <script src="script.js"></script>
</body>
</html>
