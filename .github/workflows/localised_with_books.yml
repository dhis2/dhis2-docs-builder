name: Localised Docs with books

on:
  schedule:
    - cron: '31 0 * * 0'
  workflow_dispatch:
    inputs:
      Locale:
        description: 'Locale to build'
        required: true
        default: 'fr'
        type: choice
        options:
          - fr
          - es_419
          - pt
          - cs
          - zh
          - ar
          - ALL

jobs:
  build-all-locales:

    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      matrix:
        include:
          - id: French
            locale: fr
          - id: Spanish
            locale: es_419
          - id: Portuguese
            locale: pt
          - id: Czech
            locale: cs
          - id: Chinese
            locale: zh
          - id: Arabic
            locale: ar
      fail-fast: false

    # Updated if condition to handle workflow_dispatch
    if: (github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && github.event.inputs.Locale == 'ALL')

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip

        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install custom pre-processor
      run: |
        cd tools/python/markdown-pp-master
        python3 setup.py develop
        pip install MarkdownPP

    - name: Install markdown extensions
      run: |
        cd tools/python/markdown-extensions/d_card
        python3 setup.py develop
        pip install d_card

    - name: Install dhis2_plugins for mkdocs
      run: |
        cd tools/python/dhis2_plugins
        python3 setup.py develop
        pip install dhis2_plugins

    - name: Install markdown hacks
      run: |
        # temporary hacks
        python3 -m site
        cp tools/python/blockprocessors.py ${pythonLocation}/lib/python3.9/site-packages/markdown/
        cp tools/python/attr_list.py ${pythonLocation}/lib/python3.9/site-packages/markdown/extensions/
        cp tools/python/tables.py ${pythonLocation}/lib/python3.9/site-packages/markdown/extensions/

    - name: Build the docs
      run: |
        mkdocs build
      env:
        DHIS2_DOCS_LANGUAGE: '${{ matrix.locale }}'
        DHIS2_DOCS_TX_TOKEN: ${{ secrets.DHIS2_DOCS_TX_TOKEN }}

    - name: Sync docs to S3
      uses: dhis2/s3-sync-action@master
      with:
       args: --delete --exclude 'full*' --exclude 'archive*' --cache-control 'public, max-age=3600'
      env:
        AWS_S3_BUCKET: ${{ secrets.DHIS2_S3_DOCS_BUCKET }}
        AWS_ACCESS_KEY_ID: ${{ secrets.DHIS2_S3_DOCS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.DHIS2_S3_DOCS_ACCESS_KEY }}
        AWS_REGION: 'eu-west-1'
        AWS_CF_DISTRIBUTION_ID: ${{ secrets.DHIS2_S3_DOCS_CF_ID }}
        SOURCE_DIR: 'target/${{ matrix.locale }}/.'
        DEST_DIR: '${{ matrix.locale }}/'

    - name: Install dependencies for books (playwright and imagemagick)
      run: |
        pip install playwright
        playwright install-deps
        playwright install chromium
        sudo apt-get update && sudo apt-get install -y imagemagick

    - name: Seed existing book catalogue
      # Pull the published manifest so the build merges into it (keeping older
      # versions) rather than starting from an empty catalogue. A failed download
      # aborts the run: continuing would overwrite the published catalogue with a
      # manifest holding only the latest books, de-listing the historical versions.
      run: |
        mkdir -p target/${{ matrix.locale }}/archive
        aws s3 cp s3://${{ secrets.DHIS2_S3_DOCS_BUCKET }}/archive/${{ matrix.locale }}/books.json \
          target/${{ matrix.locale }}/archive/books.json --region eu-west-1
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.DHIS2_S3_DOCS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.DHIS2_S3_DOCS_ACCESS_KEY }}

    - name: Build the books
      run: |
        cd tools/books
        python3 book_builder.py -v
      env:
        DOC_BASE_URL: '${{ github.workspace }}/target/${{ matrix.locale }}/'

    - name: Sync books to S3
      # No --delete: older versioned PDFs in the catalogue must persist.
      uses: dhis2/s3-sync-action@master
      env:
        AWS_S3_BUCKET: ${{ secrets.DHIS2_S3_DOCS_BUCKET }}
        AWS_ACCESS_KEY_ID: ${{ secrets.DHIS2_S3_DOCS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.DHIS2_S3_DOCS_ACCESS_KEY }}
        AWS_REGION: 'eu-west-1'
        SOURCE_DIR: 'target/${{ matrix.locale }}/archive/.'
        DEST_DIR: 'archive/${{ matrix.locale }}/'
        AWS_CF_DISTRIBUTION_ID: ${{ secrets.DHIS2_S3_DOCS_CF_ID }}


  build-single-locale:

    runs-on: ubuntu-latest

    # Updated if condition to handle workflow_dispatch
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.Locale != 'ALL')

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip

        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install custom pre-processor
      run: |
        cd tools/python/markdown-pp-master
        python3 setup.py develop
        pip install MarkdownPP

    - name: Install markdown extensions
      run: |
        cd tools/python/markdown-extensions/d_card
        python3 setup.py develop
        pip install d_card

    - name: Install dhis2_plugins for mkdocs
      run: |
        cd tools/python/dhis2_plugins
        python3 setup.py develop
        pip install dhis2_plugins

    - name: Install markdown hacks
      run: |
        # temporary hacks
        python3 -m site
        cp tools/python/blockprocessors.py ${pythonLocation}/lib/python3.9/site-packages/markdown/
        cp tools/python/attr_list.py ${pythonLocation}/lib/python3.9/site-packages/markdown/extensions/
        cp tools/python/tables.py ${pythonLocation}/lib/python3.9/site-packages/markdown/extensions/

    - name: Build the docs
      run: |
        mkdocs build
      env:
        DHIS2_DOCS_LANGUAGE: '${{ github.event.inputs.Locale }}'
        DHIS2_DOCS_TX_TOKEN: ${{ secrets.DHIS2_DOCS_TX_TOKEN }}

    - name: Sync docs to S3
      uses: dhis2/s3-sync-action@master
      with:
       args: --delete --exclude 'full*' --exclude 'archive*' --cache-control 'public, max-age=3600'
      env:
        AWS_S3_BUCKET: ${{ secrets.DHIS2_S3_DOCS_BUCKET }}
        AWS_ACCESS_KEY_ID: ${{ secrets.DHIS2_S3_DOCS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.DHIS2_S3_DOCS_ACCESS_KEY }}
        AWS_REGION: 'eu-west-1'
        AWS_CF_DISTRIBUTION_ID: ${{ secrets.DHIS2_S3_DOCS_CF_ID }}
        SOURCE_DIR: 'target/${{ github.event.inputs.Locale }}/.'
        DEST_DIR: '${{ github.event.inputs.Locale }}/'

    - name: Install dependencies for books (playwright and imagemagick)
      run: |
        pip install playwright
        playwright install-deps
        playwright install chromium
        sudo apt-get update && sudo apt-get install -y imagemagick

    - name: Seed existing book catalogue
      # Pull the published manifest so the build merges into it (keeping older
      # versions) rather than starting from an empty catalogue. A failed download
      # aborts the run: continuing would overwrite the published catalogue with a
      # manifest holding only the latest books, de-listing the historical versions.
      run: |
        mkdir -p target/${{ github.event.inputs.Locale }}/archive
        aws s3 cp s3://${{ secrets.DHIS2_S3_DOCS_BUCKET }}/archive/${{ github.event.inputs.Locale }}/books.json \
          target/${{ github.event.inputs.Locale }}/archive/books.json --region eu-west-1
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.DHIS2_S3_DOCS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.DHIS2_S3_DOCS_ACCESS_KEY }}

    - name: Build the books
      run: |
        cd tools/books
        python3 book_builder.py -v
      env:
        DOC_BASE_URL: '${{ github.workspace }}/target/${{ github.event.inputs.Locale }}/'

    - name: Sync books to S3
      # No --delete: older versioned PDFs in the catalogue must persist.
      uses: dhis2/s3-sync-action@master
      env:
        AWS_S3_BUCKET: ${{ secrets.DHIS2_S3_DOCS_BUCKET }}
        AWS_ACCESS_KEY_ID: ${{ secrets.DHIS2_S3_DOCS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.DHIS2_S3_DOCS_ACCESS_KEY }}
        AWS_REGION: 'eu-west-1'
        SOURCE_DIR: 'target/${{ github.event.inputs.Locale }}/archive/.'
        DEST_DIR: 'archive/${{ github.event.inputs.Locale }}/'
        AWS_CF_DISTRIBUTION_ID: ${{ secrets.DHIS2_S3_DOCS_CF_ID }}
